<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock Tower</title>
  <link rel="stylesheet" href="../../shared/style.css?v=5">
  <link rel="stylesheet" href="game.css?v=5">
</head>
<body>
  <main class="layout">
    <div class="stage" id="stage">
      <canvas id="board" aria-label="Clock Tower game board"></canvas>
      <div class="overlay" id="overlay" hidden></div>
    </div>

    <aside class="panel">
      <div class="panel-top">
        <a class="home" href="../../index.html" title="Back to the portal">🏠</a>
        <div class="level-pill">Level <span id="level">1</span></div>
        <div class="star-pill">⭐ <span id="stars">0</span></div>
      </div>

      <section class="box climb-box">
        <div class="label">🗼 Tower climb</div>
        <div class="windows" id="windows"></div>
        <div class="sub" id="floor">Floor 0 of 8</div>
      </section>

      <section class="box task-box">
        <div class="label">🔔 Clock keeper's job</div>
        <div class="skill" id="skill">—</div>
        <div class="level-title" id="level-title"></div>
      </section>

      <section class="bubble" id="bubble" aria-live="polite">
        <span class="mascot">🐼</span>
        <span id="message">Let's climb the clock tower!</span>
      </section>

      <section class="controls">
        <div><span class="key">←</span><span class="key">→</span> long hand · choose</div>
        <div><span class="key">↑</span><span class="key">↓</span> short hand (hour)</div>
        <div><span class="key">return</span> check</div>
        <div><span class="key">H</span> hint &nbsp; <span class="key">esc</span> pause &nbsp; <span class="key">M</span> music</div>
      </section>
    </aside>
  </main>

  <script src="../../shared/core.js?v=5"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
