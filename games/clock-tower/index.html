<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Quest">
  <meta name="theme-color" content="#fff8ec">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <title>Clock Tower</title>
  <link rel="stylesheet" href="../../shared/style.css?v=12">
  <link rel="stylesheet" href="game.css?v=12">
</head>
<body>
  <main class="layout">
    <div class="stage" id="stage">
      <canvas id="board" aria-label="Clock Tower game board"></canvas>
      <!-- Phone HUD (portrait: top strip, landscape: top of the right column) -->
      <div class="phone-hud" id="phud">
        <a class="ph-btn" href="../../index.html" aria-label="Back to the portal">🏠</a>
        <div class="ph-pill"><span class="ph-lv">Level </span><span class="ph-lv-s">Lv </span><b id="plevel">1</b></div>
        <div class="ph-pill">⭐ <b id="pstars">0</b></div>
        <button class="ph-btn" id="ppause" type="button" aria-label="Pause">⏸</button>
        <button class="ph-btn" id="pmusic" type="button" aria-label="Music on or off">🎵</button>
      </div>
      <!-- Laptop HUD: a slim bar over the top of the board (home · level · windows climbed · caption · stars) -->
      <div class="topbar" id="topbar">
        <a class="tb-btn" href="../../index.html" aria-label="Back to the portal">🏠</a>
        <div class="tb-pill tb-level">Level <b id="level">1</b></div>
        <div class="tb-wins" id="windows" aria-label="Windows lit"></div>
        <div class="tb-cap" id="caption" aria-live="polite"></div>
        <div class="tb-pill tb-stars" id="starpill">⭐ <b id="stars">0</b></div>
        <button class="tb-btn touch-only" id="tpause" type="button" aria-label="Pause">⏸</button>
        <button class="tb-btn touch-only" id="tmusic" type="button" aria-label="Music on or off">🎵</button>
      </div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
  </main>

  <script src="../../shared/core.js?v=12"></script>
  <script src="../../shared/fx.js?v=12"></script>
  <script src="../../shared/town-data.js?v=12"></script>
  <script src="../../shared/wash.js?v=12"></script>
  <script src="game.js?v=12"></script>
</body>
</html>
