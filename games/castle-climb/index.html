<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Quest">
  <meta name="theme-color" content="#fff8ec">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <title>Castle Climb</title>
  <link rel="stylesheet" href="../../shared/style.css?v=11">
  <link rel="stylesheet" href="game.css?v=11">
</head>
<body>
  <main class="layout">
    <div class="stage" id="stage">
      <canvas id="board" aria-label="Castle Climb game board"></canvas>
      <div class="overlay" id="overlay" hidden></div>
    </div>

    <aside class="panel">
      <div class="panel-top">
        <a class="home" href="../../index.html" title="Back to the portal">🏠</a>
        <div class="level-pill">Level <span id="level">1</span></div>
        <div class="star-pill">⭐ <span id="stars">0</span></div>
      </div>

      <section class="box problem-box">
        <div class="label">🏮 Jump to the answer</div>
        <div class="big" id="problem">—</div>
        <div class="zh sub" id="problem-zh"></div>
      </section>

      <section class="box floor-box">
        <div class="label">🏯 Floor <b id="floor">0</b> of 10</div>
        <div class="track" id="track"></div>
        <div class="tally" id="tally"></div>
      </section>

      <section class="bubble" id="bubble" aria-live="polite">
        <span class="mascot">🐼</span>
        <span id="message">Let's climb the tower!</span>
      </section>

      <section class="controls keys-only">
        <div><span class="key">←</span><span class="key">→</span> walk under an answer</div>
        <div><span class="key">↑</span> or <span class="key">space</span> jump up</div>
        <div><span class="key">↓</span> hear it again · <span class="key">H</span> hint</div>
        <div><span class="key">esc</span> pause · <span class="key">M</span> music on / off</div>
      </section>

      <nav class="touchbar" aria-label="Game buttons">
        <button type="button" data-act="hear" aria-label="Hear it again" title="Hear it again">🔊</button>
        <button type="button" data-act="hint" aria-label="Hint" title="Hint">💡</button>
        <button type="button" data-act="pause" aria-label="Pause" title="Pause">⏸️</button>
        <button type="button" data-act="music" aria-label="Music on or off" title="Music on / off">🎵</button>
      </nav>
    </aside>
  </main>

  <script src="../../shared/core.js?v=11"></script>
  <script src="problems.js?v=11"></script>
  <script src="game.js?v=11"></script>
</body>
</html>
