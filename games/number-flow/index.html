<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Quest">
  <meta name="theme-color" content="#fff8ec">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <title>Number Flow</title>
  <link rel="stylesheet" href="../../shared/style.css?v=9">
  <link rel="stylesheet" href="game.css?v=9">
</head>
<body>
  <main class="layout" id="layout">
    <div class="stage" id="stage">
      <canvas id="board" aria-label="Number Flow puzzle board"></canvas>
      <div class="overlay" id="overlay" hidden></div>
    </div>

    <aside class="panel">
      <div class="panel-top">
        <a class="home" href="../../index.html" title="Back to the portal" aria-label="Back to the portal">🏠</a>
        <div class="level-pill">Level <span id="level">1</span></div>
        <div class="star-pill">⭐ <span id="stars">0</span></div>
      </div>

      <section class="box pairs-box">
        <div class="label">🎯 Connect the dots</div>
        <div class="pairs" id="pairs"></div>
      </section>

      <section class="box sum-box" id="sum-box">
        <div class="label">➕ Adding up</div>
        <div class="sentence" id="sentence">—</div>
        <div class="zh sub" id="sentence-zh"></div>
        <div class="need" id="need"></div>
      </section>

      <section class="bubble" id="bubble" aria-live="polite">
        <span class="mascot">🐼</span>
        <span id="message">Move to a dot and press space!</span>
      </section>

      <section class="controls keys-only">
        <div><span class="key">←</span><span class="key">↑</span><span class="key">↓</span><span class="key">→</span> move / draw</div>
        <div><span class="key">space</span> pick up a dot or path</div>
        <div><span class="key">esc</span> stop drawing / pause</div>
        <div><span class="key">H</span> hint 💡 <span class="dim">(fewer ⭐)</span></div>
        <div><span class="key">R</span> start over &nbsp; <span class="key">M</span> music</div>
      </section>

      <nav class="touchbar" aria-label="Game buttons">
        <button class="tb tb-hint" id="btn-hint" type="button"><span class="ic">💡</span><span class="tl" id="hint-tl">Hint</span></button>
        <button class="tb" id="btn-reset" type="button"><span class="ic">↺</span><span class="tl">Start over</span></button>
        <button class="tb" id="btn-pause" type="button"><span class="ic">⏸</span><span class="tl">Pause</span></button>
        <button class="tb" id="btn-music" type="button"><span class="ic" id="music-ic">🎵</span><span class="tl" id="music-tl">Music</span></button>
      </nav>
    </aside>
  </main>

  <script src="../../shared/core.js?v=9"></script>
  <script src="game.js?v=9"></script>
</body>
</html>
