<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Quest">
  <meta name="theme-color" content="#fff8ec">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <title>Number Flow</title>
  <link rel="stylesheet" href="../../shared/style.css?v=11">
  <link rel="stylesheet" href="game.css?v=11">
</head>
<body>
  <main class="layout" id="layout">
    <div class="stage" id="stage">
      <canvas id="board" aria-label="Number Flow puzzle board"></canvas>
      <div class="idle-host" id="idle-host"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>

    <aside class="panel">
      <div class="panel-top">
        <a class="home" href="../../index.html" title="Back to the portal" aria-label="Back to the portal">🏠</a>
        <div class="level-pill"><span class="lv-word">Level</span><span class="lv-ic" aria-hidden="true">🧩</span> <span id="level">1</span></div>
        <div class="star-pill" id="star-pill">⭐ <span id="stars">0</span></div>
        <div class="wash-slot" id="wash-slot"></div>
      </div>

      <section class="box pairs-box">
        <div class="label">🎯 Connect the dots</div>
        <div class="pairs" id="pairs"></div>
      </section>

      <section class="box sum-box" id="sum-box">
        <div class="label">➕ Adding up</div>
        <div class="sentence" id="sentence">—</div>
        <div class="zh sub" id="sentence-zh"></div>
        <div class="need" id="need"></div>
      </section>

      <section class="bubble" id="bubble" aria-live="polite">
        <span class="mascot" id="mascot"></span>
        <span id="message"></span>
      </section>

      <nav class="touchbar" aria-label="Game buttons">
        <button class="tb tb-hint" id="btn-hint" type="button"><span class="ic">💡</span><span class="tl" id="hint-tl">Hint</span></button>
        <button class="tb" id="btn-reset" type="button"><span class="ic">↺</span><span class="tl">Start over</span></button>
        <button class="tb" id="btn-pause" type="button"><span class="ic">⏸</span><span class="tl">Pause</span></button>
        <button class="tb" id="btn-music" type="button"><span class="ic" id="music-ic">🎵</span><span class="tl" id="music-tl">Music</span></button>
      </nav>
    </aside>
  </main>

  <script src="../../shared/core.js?v=11"></script>
  <script src="../../shared/fx.js?v=11"></script>
  <script src="../../shared/town-data.js?v=11"></script>
  <script src="../../shared/wash.js?v=11"></script>
  <script src="game.js?v=11"></script>
</body>
</html>
