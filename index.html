<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Quest</title>
  <link rel="stylesheet" href="shared/style.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">🧮</span>
      <div>
        <h1>Math Quest <span class="zh">数学探险</span></h1>
        <div class="hello" id="hello">Welcome!</div>
      </div>
    </div>
    <div class="me">
      <span class="hero-now" id="hero-now">🐥</span>
      <span class="star-count">⭐ <b id="star-count">0</b></span>
    </div>
  </header>

  <main>
    <h2 class="section">Pick a game <span class="tip">use <span class="key">←</span><span class="key">→</span><span class="key">↑</span><span class="key">↓</span> and <span class="key">return</span></span></h2>
    <div class="games" id="games"></div>

    <h2 class="section">Your hero</h2>
    <div class="heroes" id="heroes"></div>
  </main>

  <footer>
    <button class="btn secondary small nav" id="grownups-btn">👩‍👧 Grown-ups</button>
  </footer>

  <dialog id="name-dialog" class="dialog">
    <form method="dialog" id="name-form">
      <h2>Hi! What's your name?</h2>
      <input id="name-input" maxlength="20" autocomplete="off" placeholder="Type your name">
      <div class="row">
        <button class="btn" value="ok">Let's play! ⏎</button>
      </div>
    </form>
  </dialog>

  <dialog id="grownups" class="dialog wide">
    <div class="gp-head">
      <h2>Grown-ups corner</h2>
      <button class="btn secondary small" id="gp-close">Close</button>
    </div>
    <div id="gp-body"></div>
  </dialog>

  <script src="shared/core.js"></script>
  <script src="portal.js"></script>
</body>
</html>
